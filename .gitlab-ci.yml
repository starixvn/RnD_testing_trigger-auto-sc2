stages: 
  - testMain

build:
  stage: testMain
  tags:
    - docker-automation-test
  variables:
    LIST_GAME: "SEDIE VIpSedie TurboBigSmall BigSmall MiniSedie BigSmallSicBo BlackJack SedieWar TurboOddEven"
  script:
    - apk add jq
    - arr=${PRODUCT//,/ }
    - >
      for i in $LIST_GAME ; do
        listGame=$(echo ${i} | tr '[:upper:]' '[:lower:]')
        for g in $arr ; do
            product=$(echo ${g} | tr '[:upper:]' '[:lower:]')
            if [ "$product" == "$listGame" ] || [ "$product" == "all" ] ;
            then
                isReady=0
                while [[ $isReady == 0 ]] ; do
                  countStatus=$(curl --header "PRIVATE-TOKEN:vuLfNcDKeAFFXnd43SFa" "https://git3.nexdev.net/api/v4/projects/486/pipelines?scope=running" | jq length)
                  echo "$countStatus"
                  if [ $countStatus -lt 2 ] ;
                  then
                    isReady=1
                    echo "$i"
                    curl -X POST -F token=6021e9c64e476516106c9b77e647e5 -F ref=master -F variables[PRODUCT]=$i -F variables[env]=$env -F variables[parentTrigger]=$CI_PIPELINE_ID -F variables[Mode]=$Mode https://git3.nexdev.net/api/v4/projects/486/trigger/pipeline
                  else
                    sleep 20
                  fi
                  sleep 5
                done
            fi
        done
      done
